# Central Configuration for Adaptive Transformer (DistilBERT on CLINC150)

experiment:
  name: "multiexit_distilbert_clinc150"
  seed: 42
  device: "cuda" # Automatically falls back to cpu if cuda unavailable

data:
  raw_path: "data/raw/data_full.json"
  processed_dir: "data/processed"
  max_seq_len: 32 # CLINC150 queries are short voice commands
  num_classes: 150

model:
  backbone_name: "distilbert-base-uncased"
  exit_layers: [2, 4, 6] # 1-based indexing for conceptual exits (mapped to layer indices [1, 3, 5])
  hidden_dim: 768
  controller_hidden_dim: 64

training:
  batch_size: 32
  eval_batch_size: 64
  learning_rate: 3.0e-5
  weight_decay: 0.01
  num_epochs: 5
  warmup_ratio: 0.1
  # Loss weights for multi-exit joint training: L = w2*L2 + w4*L4 + w6*L6
  loss_weights:
    exit_2: 0.3
    exit_4: 0.3
    exit_6: 1.0

paths:
  checkpoints_dir: "checkpoints"
  results_dir: "results"
